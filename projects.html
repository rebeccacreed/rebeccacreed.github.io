<head>
  <LINK href="styles.css" rel="stylesheet" type="text/css">
  <title>Projects</title>
  <style>
    .chatbot-container {
      width: 90%;
      max-width: 600px;
      margin: 20px auto;
      border: 2px solid #333;
      border-radius: 10px;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      height: 500px;
      font-family: Arial, sans-serif;
    }

    .chatbot-header {
      background-color: #007bff;
      color: white;
      padding: 15px;
      border-radius: 8px 8px 0 0;
      font-size: 18px;
      font-weight: bold;
    }

    .chatbot-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background-color: #fff;
    }

    .message {
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 5px;
      max-width: 80%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user-message {
      background-color: #007bff;
      color: white;
      margin-left: auto;
      text-align: right;
    }

    .bot-message {
      background-color: #e9ecef;
      color: #333;
      margin-right: auto;
    }

    .chatbot-input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ddd;
      background-color: #f9f9f9;
    }

    .chatbot-input-area input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
      margin-right: 10px;
    }

    .chatbot-input-area button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .chatbot-input-area button:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>
  <h1><center>Projects</center></h1>
  <h3><center>College Campus Reviews</center></h3>
  
  <!-- Chatbot Container -->
  <div class="chatbot-container">
    <div class="chatbot-header">🎓 University Recommendation Chatbot</div>
    <div class="chatbot-messages" id="messages"></div>
    <div class="chatbot-input-area">
      <input 
        type="text" 
        id="userInput" 
        placeholder="Ask about universities..." 
        onkeypress="handleKeyPress(event)"
      >
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <br>
  <center><a href="index.html">Go Back</a></center>

  <script>
    const messagesContainer = document.getElementById("messages");
    const userInput = document.getElementById("userInput");

    function displayWelcomeMessage() {
      const welcomeMessage = `🤖 Welcome to the University Recommendation Chatbot!
I can help you find the best university based on student reviews.

You can ask things like:
- "Compare UCLA and Yale"
- "Tell me about Yale"
- "Which university has the best academics?"
- "Show universities with strong community"`;
      
      displayMessage(welcomeMessage, "bot");
    }

    function displayMessage(text, sender) {
      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message");
      messageDiv.classList.add(sender === "user" ? "user-message" : "bot-message");
      messageDiv.textContent = text;
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function sendMessage() {
      const message = userInput.value.trim();

      if (!message) return;

      displayMessage(message, "user");
      userInput.value = "";

      displayMessage("Thinking...", "bot");

      fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ message }),
      })
        .then((response) => response.json())
        .then((data) => {
          const lastMessage = messagesContainer.lastChild;
          if (lastMessage.textContent === "Thinking...") {
            lastMessage.remove();
          }

          displayMessage(data.response, "bot");
        })
        .catch((error) => {
          const lastMessage = messagesContainer.lastChild;
          if (lastMessage.textContent === "Thinking...") {
            lastMessage.remove();
          }

          displayMessage("Sorry, there was an error. Please try again.", "bot");
          console.error("Error:", error);
        });
    }

    function handleKeyPress(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    window.addEventListener("load", displayWelcomeMessage);
  </script>
</body>
